@defer (on idle) {
  <app-summoning-circle></app-summoning-circle>
}
<app-hud></app-hud>

<header>
  <div class="brand">
    <div class="glyph">CA</div>
    <div>
      <div class="nm">CAMILO AYALA</div>
      <div class="role eyebrow">{{ 'role' | transloco }}</div>
    </div>
  </div>

  <nav class="links">
    <a href="#work">{{ 'nav_work' | transloco }}</a>
    <a href="#experience">{{ 'nav_xp' | transloco }}</a>
    <a href="#services">{{ 'nav_services' | transloco }}</a>
    <a href="#contact">{{ 'nav_contact' | transloco }}</a>
  </nav>

  <div class="controls">
    <div class="seg" id="lang">
      <button
        type="button"
        [class.on]="transloco.getActiveLang() === 'es'"
        (click)="setLang('es')"
      >
        ES
      </button>
      <button
        type="button"
        [class.on]="transloco.getActiveLang() === 'en'"
        (click)="setLang('en')"
      >
        EN
      </button>
    </div>

    <div class="seg signal" id="screen">
      <button type="button" [class.on]="!isAdminScreen()" (click)="goTo('site')">
        {{ 'sw_site' | transloco }}
      </button>
      <button type="button" [class.on]="isAdminScreen()" (click)="goTo('admin')">
        {{ 'sw_admin' | transloco }}
      </button>
    </div>

    <div class="seg" id="theme">
      <button
        type="button"
        aria-label="Modo dia"
        [class.on]="themeService.theme() === 'day'"
        (click)="setTheme('day')"
      >
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" />
        </svg>
      </button>
      <button
        type="button"
        aria-label="Modo noche"
        [class.on]="themeService.theme() === 'night'"
        (click)="setTheme('night')"
      >
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z" />
        </svg>
      </button>
    </div>
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>

<footer>
  <span class="mono">© 2026 CAMILO AYALA — BOGOTÁ, CO</span>
  <span class="mono">LAT 4.71 · LON -74.07</span>
  <span class="mono">DEPLOY: VERCEL · ANGULAR STANDALONE</span>
</footer>
