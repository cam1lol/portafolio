<section class="block wrap" id="experience">
  <div class="sec-head">
    <span class="idx mono reveal" appReveal>03</span>
    <h2 class="reveal" appReveal [appScramble]="'xp_h' | siteText" scrambleOnView></h2>
    <span class="desc reveal" appReveal>{{ 'xp_d' | siteText }}</span>
  </div>

  <div class="tl" #timeline>
    <div class="tl-line"></div>
    <div>
      @if (loading()) {
        @for (n of [1, 2]; track n) { <div class="skel skel-row" aria-hidden="true"><i></i><i></i><i></i></div> }
      }
      @for (x of EXPERIENCE(); track x.id; let i = $index) {
        <div
          class="tl-node reveal"
          [class.now]="x.isCurrent"
          appReveal
          [style.transition-delay.ms]="i * 90"
        >
          <div class="xp-card" (click)="openExperience(x)" role="button" tabindex="0" [attr.aria-label]="role(x) + ' · ' + x.company"
            (keydown.enter)="openExperience(x)" (keydown.space)="$event.preventDefault(); openExperience(x)">
            <div class="when">
              {{ period(x) }}
              <span class="tagrole">{{ tag(x) }}</span>
            </div>
            <h3>{{ role(x) }}</h3>
            <div class="co">{{ x.company }}</div>
            <div class="sum">{{ summary(x) }}</div>
            <div class="stack">
              @for (s of x.stack; track s) {
                <span class="chip">{{ s }}</span>
              }
            </div>
            <span class="more mono">
              {{ detailLabel() }}
              <app-icon name="arrow" />
            </span>
          </div>
        </div>
      }
    </div>
  </div>

  <div class="xp-cv reveal" appReveal><app-cv-button /></div>
</section>
