<div class="ticker" aria-label="Tecnologías y herramientas">
  <div class="ticker-track">
    @for (copy of [0, 1]; track copy) {
      <div
        class="ticker-group"
        [attr.aria-hidden]="copy === 1 ? 'true' : null"
      >
        @for (tech of technologies(); track $index) {
          <span class="ticker-item">{{ tech }}</span>
          <span class="ticker-separator" aria-hidden="true">/</span>
        }
      </div>
    }
  </div>
</div>
