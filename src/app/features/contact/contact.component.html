<section class="contact wrap" id="contact">
  <div class="eyebrow reveal" style="margin-bottom: 20px" appReveal>{{ 'contact_eyebrow' | siteText: "// LET'S BUILD" }}</div>
  <h2 class="reveal" appReveal [innerHTML]="'ct_h' | siteText | inlineMarkup"></h2>
  @let lead = 'ct_l' | siteText;
  <p class="lead" [appLineReveal]="lead" [textContent]="lead"></p>
  <app-availability class="contact-avail reveal" appReveal />
  @let email = 'contact_email' | siteText: ('ct_b' | siteText);
  <button #trigger type="button" class="btn primary mag reveal fx-fill" appReveal appMagnetic aria-haspopup="dialog" (click)="open.set(true)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h16v16H4zM4 7l8 6 8-6" /></svg>
    {{ 'ct_open' | transloco }}
  </button>
  <p class="direct mono reveal" appReveal>
    {{ 'ct_or' | transloco }}
    @if (mailto(email); as href) { <a [href]="href">{{ email }}</a> } @else { <span>{{ email }}</span> }
  </p>
  <app-contact-clock class="contact-clock reveal" appReveal />
  <!-- Se carga al abrir por primera vez: deja el código de formularios fuera del bundle inicial. -->
  @if (open()) {
    @defer (on immediate) {
    <app-contact-modal [returnFocusTo]="returnTo() ?? trigger" [contactEmail]="email" [service]="service()" (closed)="onClosed()" />
    }
  }
</section>
