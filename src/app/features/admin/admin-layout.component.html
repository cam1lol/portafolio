<div class="admin-shell wrap">
  <div class="admin-top">
    <div class="brand">
      <span class="brand-mark">CA</span>
      <div>
        <span class="brand-name">PANEL DE CONTROL</span>
        <span class="brand-sub mono">PORTAFOLIO · CAMILO AYALA</span>
      </div>
    </div>
    <div class="top-actions">
      <a class="btn" href="/" target="_blank" rel="noopener"><app-icon name="external" /> VER SITIO</a>
      <button type="button" class="btn" (click)="logout()"><app-icon name="logout" /> CERRAR SESIÓN</button>
    </div>
  </div>

  <div class="admin-body">
    <nav #adminNav class="admin-nav" aria-label="Secciones del panel">
      @for (group of navGroups; track group.label) {
        <div class="nav-group">
          <span class="nav-group-label mono">{{ group.label }}</span>
          @for (link of group.links; track link.path) {
            <a [routerLink]="link.path" routerLinkActive="on">
              <span class="nav-icon" aria-hidden="true"><app-icon [name]="link.icon" /></span>
              <span class="nav-label">{{ link.label }}</span>
              @if (link.badge === 'inbox' && inbox.unreadCount() > 0) {
                <span class="nav-badge mono" [attr.aria-label]="inbox.unreadCount() + ' mensajes nuevos'">{{ inbox.unreadCount() }}</span>
              }
            </a>
          }
        </div>
      }
    </nav>

    <div class="admin-content">
      <router-outlet (activate)="onActivate($event)"></router-outlet>
    </div>
  </div>
</div>

<app-confirm-dialog />
<app-toast />
