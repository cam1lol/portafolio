<div class="admin-shell wrap">
  <div class="admin-top">
    <div>
      <div class="sub mono">DASHBOARD // CONTROL PANEL</div>
      <h2>PANEL</h2>
    </div>
    <button type="button" class="btn" (click)="logout()">CERRAR SESIÓN</button>
  </div>

  <div class="admin-body">
    <nav class="admin-nav" aria-label="Secciones del panel">
      @for (group of navGroups; track group.label) {
        <div class="nav-group">
          <span class="nav-group-label mono">{{ group.label }}</span>
          @for (link of group.links; track link.path) {
            <a [routerLink]="link.path" routerLinkActive="on">{{ link.label }}</a>
          }
        </div>
      }
    </nav>

    <div class="admin-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<app-confirm-dialog />
