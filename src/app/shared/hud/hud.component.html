<div class="hud">
  <span class="tick tl"></span><span class="tick tr"></span>
  <span class="tick bl"></span><span class="tick br"></span>
  <!-- Scroll progress under the sticky header; section index on the home page (public site only). -->
  <span #progress class="progress" [hidden]="isAdmin()"></span>
  <span #index class="index" [hidden]="isAdmin() || !isHome()"></span>
</div>
