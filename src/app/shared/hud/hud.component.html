<div class="hud">
  <span class="tick tl"></span><span class="tick tr"></span>
  <span class="tick bl"></span><span class="tick br"></span>
  <!-- Progreso de scroll bajo la cabecera fija; índice de sección en la portada (solo sitio público). -->

  <span #index class="index" [hidden]="isAdmin() || !isHome()"></span>
  @if (ritual()) { <span class="ritual mono" role="status">// RITUAL DESBLOQUEADO</span> }
</div>
